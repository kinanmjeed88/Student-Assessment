name: Windows 7 build

on:
  push:
    branches:
      - feat/windows-7-support
    paths:
      - '**/*.dart'
      - 'assets/**'
      - 'lib/**'
      - 'windows/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'windows/compat/**'
      - '.github/workflows/build-windows-7.yml'
  pull_request:
    branches:
      - feat/windows-7-support
    paths:
      - '**/*.dart'
      - 'assets/**'
      - 'lib/**'
      - 'windows/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'windows/compat/**'
      - '.github/workflows/build-windows-7.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-7:
    name: Analyze and build Windows 7 release
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter 3.12
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.12.0-1.1.pre'
          channel: beta
          cache: true

      - name: Verify Flutter toolchain
        shell: pwsh
        run: flutter --version

      - name: Install Dart dependencies
        shell: pwsh
        run: flutter pub get

      - name: Verify Windows 7 platform files
        shell: pwsh
        run: |
          if (-not (Test-Path 'windows/CMakeLists.txt')) { throw 'Missing Windows platform files' }
          if (Test-Path 'android') { throw 'Android platform must not be included in the Windows 7 branch' }
          if (Test-Path 'msix.yaml') { throw 'MSIX packaging is intentionally disabled for Windows 7' }

      - name: Run Windows 7 branch checks
        shell: pwsh
        run: |
          $forbidden = @('excel_plus', 'surfaceContainerHighest', 'WidgetStatePropertyAll', 'withValues(', 'FillPatternType')
          foreach ($term in $forbidden) {
            $matches = Get-ChildItem -Path lib -Recurse -Filter '*.dart' | Select-String -SimpleMatch $term
            if ($matches) { throw "Unsupported API found: $term" }
          }

      - name: Analyze Dart code
        shell: pwsh
        run: flutter analyze --no-fatal-infos

      - name: Build Windows release
        shell: pwsh
        run: flutter build windows --release

      - name: Add Windows 7 API compatibility shim
        shell: pwsh
        run: |
          $source = 'windows/compat/api-ms-win-core-synch-l1-2-0.dll'
          if (-not (Test-Path $source)) { throw "Missing Windows 7 synchronization shim: $source" }
          Copy-Item $source 'build/windows/runner/Release/api-ms-win-core-synch-l1-2-0.dll' -Force

      - name: Package Windows 7 release
        shell: pwsh
        run: |
          $candidates = @(
            'build/windows/runner/Release',
            'build/windows/x64/runner/Release'
          )
          $source = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $source) { throw "Build output not found. Checked: $($candidates -join ', ')" }
          if (-not (Test-Path "$source/api-ms-win-core-synch-l1-2-0.dll")) { throw 'Windows 7 synchronization shim was not packaged' }
          Compress-Archive -Path "$source/*" -DestinationPath 'student-assessment-windows-7.zip' -Force

      - name: Upload Windows 7 artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-assessment-windows-7-${{ github.run_number }}
          path: student-assessment-windows-7.zip
          if-no-files-found: error
          retention-days: 30
