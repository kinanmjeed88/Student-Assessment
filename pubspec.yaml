name: almoktaber

description: تطبيق سجل الطالب لإدارة الطلاب والحضور والدرجات والسلوك محلياً.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.12.0-0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  isar_community: 3.3.1
  isar_community_flutter_libs: 3.3.1
  file_picker: 7.0.2
  path_provider: 2.1.1
  archive: 3.6.1
  xml: 6.4.2
  excel: 4.0.6
  pdf: 3.10.8
  printing: 5.12.0
  intl: 0.18.1
  url_launcher: 6.1.14
  simple_icons: ^16.23.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 2.0.3

dependency_overrides:
  collection: 1.18.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/fonts/
