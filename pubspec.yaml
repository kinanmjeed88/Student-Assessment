name: almoktaber

description: تطبيق حليف القرآن لإدارة الطلاب والحضور والدرجات والسلوك محلياً.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  isar_community: ^3.3.1
  isar_community_flutter_libs: ^3.3.1
  flutter_local_notifications: 17.2.4
  timezone: ^0.9.4
  path_provider: ^2.1.6
  file_picker: ^12.0.0
  archive: ^4.0.7
  xml: ^7.0.1
  excel_plus: ^2.14.2
  pdf: ^3.13.0
  printing: ^5.15.0
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  isar_community_generator: ^3.3.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/fonts/
