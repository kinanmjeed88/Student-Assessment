name: almoktaber

description: تطبيق سجل الطالب لإدارة الطلاب والحضور والدرجات والسلوك محلياً.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  isar_community: ^3.3.1
  isar_community_flutter_libs: ^3.3.1
  flutter_local_notifications: 22.3.0
  timezone: ^0.11.0
  path_provider: ^2.1.6
  file_picker: ^12.0.0
  archive: ^4.0.7
  xml: ^7.0.1
  excel_plus: ^2.14.2
  pdf: ^3.13.0
  intl: ^0.20.2
  url_launcher: ^6.3.1
  simple_icons: ^16.23.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  isar_community_generator: ^3.3.1
  msix: ^3.16.9

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/fonts/

msix_config:
  display_name: سجل الطالب
  publisher_display_name: AlMoktaber
  identity_name: AlMoktaber.StudentRecord
  msix_version: 1.0.0.0
  store: false
  install_certificate: false
  output_name: almoktaber
  toast_activator:
    clsid: "7e2c3b7a-3d2c-4e0d-a3d9-0d2c5d2a6b31"
    arguments: "msix-args"
    display_name: "سجل الطالب"
